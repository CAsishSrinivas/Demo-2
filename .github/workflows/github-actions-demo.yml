name: Print sample.py

on: [push]

jobs:
  PrintFile:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Print sample.py contents
        run: |
          Write-Host "=== sample.py contents ==="
          Get-Content "${{ github.workspace }}\sample.py"
        shell: powershell
